title = "vana-com EVM key scanning"
minVersion = "v8.28.0"

# GitHub secret scanning covers provider-issued credentials. This deliberately
# narrow rule covers raw EVM private keys, which have no issuer prefix.
[extend]
useDefault = false

[[rules]]
id = "raw-evm-private-key-near-secret-declaration"
description = "64-hex EVM private key near a secret-shaped declaration"
regex = '''(?i)\b(?:0x)?([0-9a-f]{64})\b'''
secretGroup = 1

  # This composite rule uses complete changed-file snapshots, so a declaration
  # on the preceding or following line remains visible.
  [[rules.required]]
  id = "secret-shaped-declaration"
  regex = '''(?i)(?:^|[^a-z0-9])(?:priv[ _-]?keys?|(?:deployer|signer|wallet)[ _-]?keys?|(?:app|builder|deployer|ephemeral|recipient|wallet|signer|owner|account)[ _-]?private[ _-]?keys?|signing[ _-]?keys?|(?:private|secret)[ _-]?keys?(?:[ _-]?(?:hex|bytes|buffer))?|key[ _-]?material)(?:[^a-z0-9]|$)'''
  withinLines = 2

