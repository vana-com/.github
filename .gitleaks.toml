# Keep value exceptions separated from rule identifiers. The policy's own
# declaration-context rule scans this file in a regression test.
# (These comments are intentionally not secret-shaped declarations.)
[[rules]]
id = "raw-evm-private-key-near-direct-api-call"
description = "64-hex EVM private key adjacent to a direct wallet API call"
regex = '''(?i)\b(?:0x)?([0-9a-f]{64})\b'''
secretGroup = 1

  # A direct-call context is intentionally tighter than a declaration context.
  # This avoids treating unrelated 32-byte identifiers as keys several lines
  # after privateKeyToAccount(generatePrivateKey()).
  [[rules.required]]
  id = "direct-wallet-api-call"
  regex = '''(?i)\b(?:privateKeyToAccount|(?:ethers\s*\.\s*)?(?:Wallet|SigningKey))\s*\('''
  withinLines = 1

