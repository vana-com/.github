[[rules]]
id = "secret-shaped-declaration"
description = "Auxiliary secret-shaped declaration matcher"
regex = '''(?i)(?:^|[^a-z0-9])(?:priv[ _-]?keys?|(?:deployer|signer|wallet)[ _-]?keys?|(?:app|builder|deployer|ephemeral|recipient|wallet|signer|owner|account)[ _-]?private[ _-]?keys?|signing[ _-]?keys?|(?:private|secret)[ _-]?keys?(?:[ _-]?(?:hex|bytes|buffer))?|key[ _-]?material)(?:[^a-z0-9]|$)'''
skipReport = true

[[rules]]
id = "direct-wallet-api-call"
description = "Auxiliary direct wallet API matcher"
regex = '''(?i)\b(?:privateKeyToAccount|(?:ethers\s*\.\s*)?(?:Wallet|SigningKey))\s*\('''
skipReport = true

[[rules]]
id = "raw-evm-private-key-in-secret-named-file"
description = "64-hex EVM private key in a secret-named file"
regex = '''(?i)\b(?:0x)?([0-9a-f]{64})\b'''
secretGroup = 1
path = '''(?i)^content/(?:.*/)?\.?(?:priv[ _-]?keys?|(?:deployer|signer|wallet)[ _-]?keys?|(?:app|builder|deployer|ephemeral|recipient|wallet|signer|owner|account)[ _-]?private[ _-]?keys?|signing[ _-]?keys?|(?:private|secret)[ _-]?keys?(?:[ _-]?(?:hex|bytes|buffer))?|key[ _-]?material)(?:\.[a-z0-9._ -]+)?$'''
